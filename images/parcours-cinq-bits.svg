<svg xmlns="http://www.w3.org/2000/svg" width="830" height="520" viewBox="0 0 830 520" role="img" aria-labelledby="title desc"><title id="title">Compression des positions constantes</title><desc id="desc">Dans 01111110, on conserve les trois premiers et les deux derniers bits : 01110, soit 14, encodé o en Base32.</desc><rect x="0" y="0" width="830" height="520" rx="0" fill="#f4f2ec" stroke="#f4f2ec"/><text x="32" y="44" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#213831" font-weight="bold" text-anchor="start">De huit bits à cinq bits : un exemple complet</text><text x="32" y="82" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#213831" font-weight="normal" text-anchor="start">126 en binaire = 01111110. Les trois positions centrales 111 sont constantes.</text><rect x="38" y="115" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="78" y="165" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">0</text><rect x="132" y="115" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="172" y="165" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">1</text><rect x="226" y="115" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="266" y="165" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">1</text><rect x="320" y="115" width="80" height="78" rx="8" fill="#e5e3dd" stroke="#cbd4c8"/><text x="360" y="165" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#53665e" font-weight="bold" text-anchor="middle">1</text><rect x="414" y="115" width="80" height="78" rx="8" fill="#e5e3dd" stroke="#cbd4c8"/><text x="454" y="165" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#53665e" font-weight="bold" text-anchor="middle">1</text><rect x="508" y="115" width="80" height="78" rx="8" fill="#e5e3dd" stroke="#cbd4c8"/><text x="548" y="165" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#53665e" font-weight="bold" text-anchor="middle">1</text><rect x="602" y="115" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="642" y="165" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">1</text><rect x="696" y="115" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="736" y="165" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">0</text><text x="175" y="220" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#186450" font-weight="normal" text-anchor="middle">hhh = 011</text><text x="457" y="220" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#53665e" font-weight="normal" text-anchor="middle">111 : retirer</text><text x="692" y="220" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#186450" font-weight="normal" text-anchor="middle">cc = 10</text><rect x="178" y="260" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="218" y="310" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">0</text><rect x="272" y="260" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="312" y="310" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">1</text><rect x="366" y="260" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="406" y="310" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">1</text><rect x="460" y="260" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="500" y="310" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">1</text><rect x="554" y="260" width="80" height="78" rx="8" fill="#e2eee7" stroke="#cbd4c8"/><text x="594" y="310" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#186450" font-weight="bold" text-anchor="middle">0</text><text x="415" y="379" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#186450" font-weight="bold" text-anchor="middle">01110₂ = 14 → caractère Base32 « o »</text><text x="32" y="424" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#213831" font-weight="normal" text-anchor="start">16 groupes de 5 bits = 80 bits = 16 caractères Base32.</text><text x="32" y="460" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#53665e" font-weight="normal" text-anchor="start">hhhcc conserve l’ordre des bits restants ; cchhh est une variante conservée.</text><text x="32" y="492" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#53665e" font-weight="normal" text-anchor="start">Le calcul est réversible sur les SPECIAL sélectionnés. Leur fonction reste une hypothèse.</text></svg>
